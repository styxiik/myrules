name: Generate Shadowrocket META

on:
  workflow_dispatch:
  push:
    branches: [main, shadowrocket-qx-port]
    paths:
      - 'META.yaml'
      - 'Clash/**'
      - '.github/workflows/generate-shadowrocket.yml'
  workflow_run:
    workflows: ["Update Checker"]
    types: [completed]

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}

      - name: Generate Shadowrocket-META.yaml
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          src = Path('META.yaml').read_text(encoding='utf-8')

          marker = 'rules:\n'
          if marker not in src:
              raise SystemExit('META.yaml does not contain a top-level rules: section')

          modules = '''# EXPERIMENTAL: Shadowrocket Clash-YAML converter module import.\n# Public docs do not document this key; validate on-device after import/compile.\nmodules:\n  - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/Shadowrocket/BlockHTTPDNS/BlockHTTPDNS.sgmodule"\n  - "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/Shadowrocket/ZhihuAssistant/ZhihuAssistantPlus/zhihu_plus.sgmodule"\n  - "https://raw.githubusercontent.com/app2smile/rules/master/module/tieba.sgmodule"\n  - "https://raw.githubusercontent.com/app2smile/rules/master/module/spotify.module"\n  - "https://raw.githubusercontent.com/Maasea/sgmodule/master/YouTube.Enhance.sgmodule"\n\n'''

          shadowrocket_rules = '''rules:\n  # Shadowrocket native Tailscale policy must win before generic LAN/DIRECT rules.\n  - DOMAIN-WILDCARD,tail*.ts.net,TAILSCALE\n  - DOMAIN-SUFFIX,ts.net,TAILSCALE\n  - IP-CIDR,100.64.0.0/10,TAILSCALE,no-resolve\n  - IP-CIDR6,fd7a:115c:a1e0::/48,TAILSCALE,no-resolve\n\n  # Disable Internet QUIC/HTTP3 by default; Tailscale traffic above is exempt.\n  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT\n'''

          out = src.replace(marker, modules + shadowrocket_rules, 1)

          header = '''# AUTO-GENERATED from META.yaml for Shadowrocket.\n# Keep META.yaml as the routing/subscription source of truth.\n# Shadowrocket imports this Clash YAML directly, including MyownMETA订阅.\n# This test build also carries an experimental top-level modules: list to verify whether\n# Shadowrocket's internal Clash converter automatically installs native modules.\n\n'''
          out = header + out

          Path('Shadowrocket-META.yaml').write_text(out, encoding='utf-8')

          checks = [
              'url: "MyownMETA订阅"',
              'modules:',
              'BlockHTTPDNS.sgmodule',
              'YouTube.Enhance.sgmodule',
              'DOMAIN-WILDCARD,tail*.ts.net,TAILSCALE',
              'IP-CIDR,100.64.0.0/10,TAILSCALE,no-resolve',
              'IP-CIDR6,fd7a:115c:a1e0::/48,TAILSCALE,no-resolve',
              'AND,((NETWORK,UDP),(DST-PORT,443)),REJECT',
              'MATCH,最终选择',
          ]
          for check in checks:
              if check not in out:
                  raise SystemExit(f'Missing expected Shadowrocket config item: {check}')
          PY

      - name: Commit generated Shadowrocket META
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "noreply@github.com"
          git add Shadowrocket-META.yaml
          if git diff --cached --quiet; then
            echo "No Shadowrocket META changes"
            exit 0
          fi
          git commit -m "Update Shadowrocket META"
          git push
