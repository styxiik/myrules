name: Update Shadowrocket Bundle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main, shadowrocket-all-in-one-module]
    paths:
      - 'Shadowrocket/Modules/sources.json'
      - 'Shadowrocket/Modules/Tailscale.sgmodule'
      - 'scripts/build_shadowrocket_bundle.py'
      - '.github/workflows/update-shadowrocket-bundle.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply routing order fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('META.yaml')
          s = p.read_text(encoding='utf-8')
          new_rules = '''rules:
  # Protocol / system exceptions
  - SUB-RULE,(AND,((DST-PORT,443),(NETWORK,UDP))),QUIC
  - AND,((DST-PORT,9993),(NETWORK,UDP)),DIRECT

  # Repair / override rules
  - RULE-SET,Unbreak,DIRECT,no-resolve

  # Explicit custom rules: REJECT -> DIRECT -> PROXY
  - RULE-SET,ClashReject,REJECT,no-resolve
  - RULE-SET,ClashDirect,DIRECT,no-resolve
  - RULE-SET,ClashProxy,PROXY,no-resolve

  # Generic domain rules: REJECT -> DIRECT -> PROXY
  # - RULE-SET,reject,REJECT,no-resolve
  - DOMAIN-SUFFIX,cn,DIRECT
  - RULE-SET,private,DIRECT,no-resolve
  - RULE-SET,direct,DIRECT,no-resolve
  - RULE-SET,icloud,DIRECT,no-resolve
  - RULE-SET,apple,DIRECT,no-resolve
  # - RULE-SET,applications,DIRECT
  - DOMAIN-SUFFIX,goog,PROXY
  - RULE-SET,gfw,PROXY
  - RULE-SET,cryptocurrency,PROXY
  - RULE-SET,google,PROXY
  - RULE-SET,greatfire,PROXY

  # IP rules: DIRECT -> PROXY
  - RULE-SET,lancidr,DIRECT,no-resolve
  - RULE-SET,cncidr,DIRECT,no-resolve
  - RULE-SET,cnipv6,DIRECT,no-resolve
  - RULE-SET,telegramcidr,PROXY,no-resolve
  - RULE-SET,cfip,PROXY,no-resolve
  - RULE-SET,googleip,PROXY,no-resolve

  # Special fallback: only direct AWS/CloudFront after every explicit PROXY rule had a chance to match
  - RULE-SET,cloudfrontip,DIRECT,no-resolve

  # Final geographic fallback
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,最终选择
'''
          s, n = re.subn(r'(?ms)^rules:\n.*?(?=^sub-rules:)', new_rules, s, count=1)
          if n != 1:
              raise SystemExit('META rules block not found exactly once')
          p.write_text(s, encoding='utf-8')

          p = Path('QX.conf')
          s = p.read_text(encoding='utf-8')
          new_remote = '''[filter_remote]
FILTER_LAN, tag=LAN, force-policy=direct, enabled=true
FILTER_REGION, tag=CN, force-policy=direct, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Filter/master/Unbreak.list, tag=规则修正, force-policy=direct, update-interval=172800, opt-parser=true, enabled=true
https://raw.githubusercontent.com/styxiik/myrules/main/Clash/ClashReject.yaml, tag=🚫 ClashReject, force-policy=reject, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/styxiik/myrules/main/Clash/ClashDirect.yaml, tag=🐼 ClashDirect, force-policy=direct, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/styxiik/myrules/main/Clash/ClashProxy.yaml, tag=🎈ClashProxy, force-policy=🎯 节点, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/reject.txt, tag=🛡️达咩, force-policy=reject, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/private.txt, tag=🛡️PrivacyPlus, force-policy=direct, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/apple.txt, tag=🍎 Apple, force-policy=direct, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/icloud.txt, tag=🍎 icloud, force-policy=direct, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/direct.txt, tag=🐼 ChinaDomain, force-policy=direct, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/proxy.txt, tag=🌍 国外网站, force-policy=🎯 节点, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/gfw.txt, tag=🌍 国外网站GFW, force-policy=🎯 节点, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Cryptocurrency/Cryptocurrency.list, tag=🌍 加密货币, force-policy=🎯 节点, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/cncidr.txt, tag=🐼 ChinaIP, force-policy=direct, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/styxiik/myrules/main/QX/cnipv6.txt, tag=🐼 ChinaIP6, force-policy=direct, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/styxiik/myrules/main/QX/cfip.txt, tag=🌍 CloudFlareIP, force-policy=🎯 节点, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/styxiik/myrules/main/QX/googleip.txt, tag=🌍 GoogleIP, force-policy=🎯 节点, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/telegramcidr.txt, tag=💻 Telegram, force-policy=🎯 节点, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/styxiik/myrules/main/QX/cft.txt, tag=🌍 CloudfrontIP, force-policy=direct, update-interval=86400, opt-parser=true, enabled=true
'''
          s, n = re.subn(r'(?ms)^\[filter_remote\]\n.*?(?=^\[rewrite_remote\])', new_remote + '\n', s, count=1)
          if n != 1:
              raise SystemExit('QX filter_remote block not found exactly once')

          new_local = '''[filter_local]
host-suffix, local, direct
host-wildcard, *.cn, direct
host-wildcard, *.goog, 🎯 节点
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/24, direct
geoip, cn, direct
Final, 🕹 终极清单
'''
          s, n = re.subn(r'(?ms)^\[filter_local\]\n.*?(?=^\[http_backend\])', new_local + '\n', s, count=1)
          if n != 1:
              raise SystemExit('QX filter_local block not found exactly once')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate routing order
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          meta = Path('META.yaml').read_text(encoding='utf-8')
          qx = Path('QX.conf').read_text(encoding='utf-8')
          for text, markers in [
              (meta, ['ClashReject,REJECT','ClashDirect,DIRECT','ClashProxy,PROXY','RULE-SET,gfw,PROXY','RULE-SET,cncidr,DIRECT','RULE-SET,telegramcidr,PROXY','RULE-SET,cfip,PROXY','RULE-SET,googleip,PROXY','RULE-SET,cloudfrontip,DIRECT','MATCH,最终选择']),
              (qx, ['ClashReject.yaml','ClashDirect.yaml','ClashProxy.yaml','surge-rules/release/direct.txt','surge-rules/release/proxy.txt','surge-rules/release/cncidr.txt','/QX/cfip.txt','/QX/googleip.txt','telegramcidr.txt','/QX/cft.txt']),
          ]:
              pos = [text.index(m) for m in markers]
              if pos != sorted(pos):
                  raise SystemExit(f'Routing order validation failed: {pos}')
          if 'skip_validating_cert = true' not in qx or 'udp_drop_list = 443' not in qx:
              raise SystemExit('QX safety invariants changed unexpectedly')
          PY

      - name: Build all-in-one Shadowrocket module
        run: python3 scripts/build_shadowrocket_bundle.py

      - name: Commit routing order
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "noreply@github.com"
          git add META.yaml QX.conf Shadowrocket/Modules/All-in-One.sgmodule
          if git diff --cached --quiet; then
            echo "No routing order changes"
            exit 0
          fi
          git commit -m "Reorder routing rules"
          git push
