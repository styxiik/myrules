name: One-time QX Disable QUIC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-qx-disable-quic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable QUIC in Quantumult X
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('QX.conf')
          text = path.read_text(encoding='utf-8')

          if not re.search(r'(?m)^\s*udp_drop_list\s*=\s*443\s*$', text):
              text, n = re.subn(
                  r'(?m)^(\s*udp_whitelist\s*=.*)$',
                  r'\1\nudp_drop_list = 443',
                  text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit('udp_whitelist line not found')

          text = re.sub(
              r'(?m)^\s*prefer-doh3\s*$',
              ';prefer-doh3  ; disabled because UDP/443 (QUIC/HTTP3) is globally dropped',
              text,
              count=1,
          )

          if not re.search(r'(?m)^\s*udp_drop_list\s*=\s*443\s*$', text):
              raise SystemExit('udp_drop_list = 443 was not applied')
          if re.search(r'(?m)^\s*prefer-doh3\s*$', text):
              raise SystemExit('prefer-doh3 is still enabled')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit QX change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "noreply@github.com"
          git rm .github/workflows/one-time-qx-disable-quic.yml
          git add QX.conf
          git commit -m "Disable QUIC in Quantumult X"
          git push
